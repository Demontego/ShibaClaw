name: shibaclaw_desktop
description: ShibaClaw desktop client for the existing WebUI HTTP and WebSocket API.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  flutter_markdown: ^0.7.7
  http: ^1.5.0
  shared_preferences: ^2.5.3
  web_socket_channel: ^3.0.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n_catalogs.js
    - assets/shibaclaw_logo.webp
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
