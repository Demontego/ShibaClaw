name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - '.gitignore'
      - '.gitattributes'
      - '.dockerignore'
      - 'assets/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - '.gitignore'
      - '.gitattributes'
      - '.dockerignore'
      - 'assets/**'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
        working-directory: shibaclaw/webui
      - run: npm test
        working-directory: shibaclaw/webui
      - run: npm run build
        working-directory: shibaclaw/webui

  test:
    name: Run Tests and Linters
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-packages --extra dev

      - name: Verify packaged application versions
        run: uv run python scripts/verify_release.py

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Test with pytest
        run: uv run pytest tests/

  test-windows:
    name: Desktop Smoke Test (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies (desktop + dev)
        shell: bash
        run: uv sync --frozen --all-packages --extra dev --extra desktop --extra windows-native

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Smoke-test desktop imports
        run: >
          uv run python -c "import shibaclaw; import webview; import pystray;
          from PIL import Image;
          from shibaclaw.desktop.runtime import DesktopRuntime;
          from shibaclaw.desktop.controller import DesktopController;
          from shibaclaw.helpers.system import get_installation_method;
          print('install method:', get_installation_method())"

      - name: Run pytest
        run: uv run pytest tests/ -x -q

      - name: Build desktop bundle
        run: uv run python scripts/build_windows.py

      - name: Verify Windows bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ShibaClaw/ShibaClaw.exe")) {
            throw "Missing dist/ShibaClaw/ShibaClaw.exe"
          }

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/ShibaClaw/ShibaClaw.exe" -ArgumentList "gateway", "--help" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "ShibaClaw.exe gateway --help failed with exit code $($proc.ExitCode)"
          }

          $proc = Start-Process -FilePath "dist/ShibaClaw/ShibaClaw.exe" -ArgumentList "--verify-desktop" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "ShibaClaw.exe desktop dependency verification failed with exit code $($proc.ExitCode)"
          }

      - name: Build Windows setup and validate update feed
        run: uv run python scripts/package_windows.py --install-tool

      - name: Keep Windows setup for review
        uses: actions/upload-artifact@v4
        with:
          name: ShibaClaw-windows-setup-ci
          path: |
            dist/windows-setup/ShibaClaw-Setup.exe
            dist/windows-setup/*-full.nupkg
            dist/windows-setup/releases.win.json
            dist/windows-setup/SHA256SUMS
            dist/ShibaClaw-windows.zip
          if-no-files-found: error
          retention-days: 7
