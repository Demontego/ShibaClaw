name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  verify-release-tag:
    name: Verify Release Tag Target
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tag commit is contained in origin/main
        run: |
          git fetch origin main --force
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Tag ${GITHUB_REF_NAME} points to ${GITHUB_SHA}, which is not contained in origin/main." >&2
            echo "Releases are repository-wide; tag only commits that are already on main." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag and all packaged application versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/verify_release.py --tag "$RELEASE_TAG"

  # ── PyPI ────────────────────────────────────────────────────────────────────
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: verify-release-tag
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install build tools
        run: uv sync --frozen --extra dev

      - name: Build WebUI frontend
        run: |
          cd shibaclaw/webui
          npm ci
          node build.mjs

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # ── Docker Hub ──────────────────────────────────────────────────────────────
  docker:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: verify-release-tag
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shibaclaw:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shibaclaw:${{ steps.meta.outputs.version }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify-release-tag, pypi, docker, windows-exe]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ShibaClaw-windows-exe
          path: dist-windows/

      - name: Publish GitHub release with Windows setup, update feed and portable ZIP
        id: windows_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shibaclaw/updater/update_manifest.json
            dist-windows/ShibaClaw-windows.zip
            dist-windows/windows-setup/ShibaClaw-Setup.exe
            dist-windows/windows-setup/*-full.nupkg
            dist-windows/windows-setup/releases.win.json
            dist-windows/windows-setup/SHA256SUMS
            scripts/install/install.ps1
            scripts/install/install.sh
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true

      - name: Verify uploaded artifacts before publishing the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ steps.windows_release.outputs.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" | python scripts/verify_release_assets.py --tag "$RELEASE_TAG" --checksums dist-windows/windows-setup/SHA256SUMS

      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.windows_release.outputs.id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false > /dev/null

  # ── Windows .exe (PyInstaller onedir) ───────────────────────────────────────
  windows-exe:
    name: Build Windows .exe
    runs-on: windows-latest
    needs: verify-release-tag
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies (desktop + dev)
        shell: bash
        run: >
          uv sync --frozen --all-packages
          --extra dev --extra desktop --extra rag --extra windows-native --extra all-channels

      - name: Build with PyInstaller
        run: uv run python scripts/build_windows.py

      - name: Smoke-test CLI path
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/ShibaClaw/ShibaClaw.exe" -ArgumentList "gateway", "--help" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "ShibaClaw.exe gateway --help failed with exit code $($proc.ExitCode)"
          }

      - name: Smoke-test desktop dependencies
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/ShibaClaw/ShibaClaw.exe" -ArgumentList "--verify-desktop" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "Desktop dependency verification failed with exit code $($proc.ExitCode)"
          }

      - name: Unblock bundled DLLs
        shell: pwsh
        run: Get-ChildItem dist/ShibaClaw -Recurse -Include '*.dll','*.exe' | Unblock-File

      - name: Package Windows setup, Velopack feed and legacy portable ZIP
        run: uv run python scripts/package_windows.py --install-tool
        # Optional signing uses Velopack's existing VPK_SIGN_PARAMS or
        # VPK_SIGN_TEMPLATE environment configuration. Without a configured
        # signing identity this produces unsigned artifacts; SHA256 verifies
        # download integrity, not a publisher signature.

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShibaClaw-windows-exe
          path: |
            dist/ShibaClaw-windows.zip
            dist/windows-setup/ShibaClaw-Setup.exe
            dist/windows-setup/*-full.nupkg
            dist/windows-setup/releases.win.json
            dist/windows-setup/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
